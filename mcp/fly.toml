# Fly.io deployment for the AWebChatbot MCP server (Streamable HTTP at /mcp).
#   fly launch --no-deploy --copy-config --name awebchatbot-mcp
#   fly secrets set AWEBCHATBOT_URL=... AWEBCHATBOT_TOKEN=... MCP_AUTH_TOKEN=...
#   fly deploy

app = "awebchatbot-mcp"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
