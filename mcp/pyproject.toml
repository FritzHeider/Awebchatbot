[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "awebchatbot-mcp"
version = "1.0.0"
description = "MCP server that lets Claude run AWebChatbot: website chatbots, live chat inbox, customers, knowledge base and chatbot flows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp>=2.3,<3",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "starlette>=0.37",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
awebchatbot-mcp = "awebchatbot_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["awebchatbot_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
