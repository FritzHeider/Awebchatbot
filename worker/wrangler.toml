# AWebChatbot - Cloudflare Worker configuration
# Run ../scripts/bootstrap.sh once: it creates the D1 database, KV namespace,
# R2 bucket, Vectorize index and Queues, then writes their IDs into this file.

name = "awebchatbot"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[observability]
enabled = true

# Widget script (/widget.js) and the shared inbox (/inbox/) are static assets.
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[vars]
PUBLIC_BASE_URL = "https://awebchatbot.blueloke.workers.dev"
DEFAULT_PROVIDER = "anthropic"
FALLBACK_PROVIDERS = "gemini,xai,workers-ai"
ANTHROPIC_MODEL = "claude-haiku-5-5"
GEMINI_MODEL = "gemini-3.6-flash"
XAI_MODEL = "grok-4.6"
OPENAI_MODEL = "gpt-5-mini"
WORKERS_AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
EMBEDDING_MODEL = "@cf/baai/bge-base-en-v1.5"
CF_ACCOUNT_ID = "fd2ff8c29a6d58c479032efea6c9ea62"
AI_GATEWAY_ID = ""
AUTO_CLOSE_HOURS = "24"
MAX_CRAWL_PAGES = "150"

[[d1_databases]]
binding = "DB"
database_name = "awebchatbot"
database_id = "8b903151-2f60-4b07-b9de-de61151befae"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "239f6b02e0eb44d497b74100796aaf90"

[[r2_buckets]]
binding = "FILES"
bucket_name = "awebchatbot-files"

[[vectorize]]
binding = "VECTORIZE"
index_name = "awebchatbot-kb"

[ai]
binding = "AI"

[[queues.producers]]
binding = "CRAWL_QUEUE"
queue = "awebchatbot-crawl"

[[queues.consumers]]
queue = "awebchatbot-crawl"
max_batch_size = 5
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "awebchatbot-crawl-dlq"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "awebchatbot_events"

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "4201"

  [ratelimits.simple]
  limit = 20
  period = 60

[triggers]
crons = ["*/15 * * * *", "0 9 * * *"]
